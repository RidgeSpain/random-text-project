<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Board</title>
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Random River Background with a dark tint for readability */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://source.unsplash.com/random/1920x1080/?river');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 15%;
        }

        #displayText {
            font-size: 2.5rem;
            font-weight: 300;
            line-height: 1.4;
            max-width: 800px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        }

        #openModal {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.4s ease;
        }
        #openModal:hover { color: white; border-color: white; background: rgba(255,255,255,0.1); }

        /* Photo Credit Link in Corner */
        .photo-credit {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
        }
        .photo-credit:hover { color: white; }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        /* The Submission Note */
        .input-note {
            font-size: 0.75rem;
            color: #888;
            margin-top: 8px;
            line-height: 1.3;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-send { background: #fff; color: #000; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
        .btn-close { background: transparent; color: #888; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="displayText">Loading...</h1>
    </div>

    <button id="openModal">+</button>

    <a href="https://unsplash.com/s/photos/river" target="_blank" class="photo-credit">Image Source</a>

    <div id="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Submit Anonymously</h3>
            <textarea id="userInput" maxlength="280" placeholder="Write something..."></textarea>
            
            <div class="input-note">
                Allowed: A-Z, 0-9, and ; , . ? ! ' " - + &<br>
                Please type manually (copy-paste may cause errors).
            </div>

            <div class="modal-buttons">
                <button class="btn-close" onclick="closeModal()">Cancel</button>
                <button class="btn-send" onclick="submitText()">Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Use your actual Supabase details here
        const supabaseUrl = 'https://gklqwymwbyqeqiqkvdbl.supabase.co';
        const supabaseKey = 'sb_publishable_bgbE_43-S430QZ8GtfI8dw_WG-oB0MN';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const modal = document.getElementById('modal');
        const btn = document.getElementById('openModal');
        const display = document.getElementById('displayText');
        const input = document.getElementById('userInput');

        async function getRandomSubmission() {
            const { data, error } = await supabaseClient
                .from('submissions')
                .select('content')
                .eq('is_approved', true);
            
            if (data && data.length > 0) {
                const randomEntry = data[Math.floor(Math.random() * data.length)];
                display.innerText = randomEntry.content;
            } else {
                display.innerText = "No approved submissions found.";
            }
        }

        async function submitText() {
            const text = input.value.trim();
            if (!text) return;

            // Character Filter including "Smart Quotes" from copy-pastes
            const allowedChars = /^[a-zA-Z0-9\s;,.?!'\"\-\+&\u2018\u2019\u201C\u201D]+$/;
            
            if (!allowedChars.test(text)) {
                alert("Only letters, numbers, and ;,.?!'\"-+& are allowed.");
                return;
            }

            const { error } = await supabaseClient
                .from('submissions')
                .insert([{ content: text }]);

            if (!error) {
                input.value = "";
                closeModal();
                alert("Submission received!");
            } else {
                alert("Submission failed. Check your characters.");
            }
        }

        btn.onclick = () => modal.style.display = "block";
        function closeModal() { modal.style.display = "none"; }
        window.onclick = (event) => { if (event.target == modal) closeModal(); }

        getRandomSubmission();
    </script>
</body>
</html>
