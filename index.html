<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; }
        
        /* The Center Text */
        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a; /* Placeholder background */
            color: white;
            text-align: center;
            padding: 40px;
        }

        /* The Blended Button */
        #openModal {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2); /* Blends in */
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }
        #openModal:hover { color: white; border-color: white; }

        /* Simple Popup/Modal */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); }
        .modal-content { 
            background: #333; padding: 20px; border-radius: 8px;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="displayText">Loading...</h1>
    </div>

    <button id="openModal">+</button>

    <div id="modal">
        <div class="modal-content">
            <textarea id="userInput" maxlength="280" placeholder="Type here..."></textarea><br>
            <button onclick="submitText()">Send</button>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="text/javascript">
    // 2. Initialize with a unique name 'supabaseClient' to avoid the error
    const supabaseUrl = 'https://gklqwymwbyqeqiqkvdbl.supabase.co';
    const supabaseKey = 'sb_publishable_bgbE_43-S430QZ8GtfI8dw_WG-oB0MN';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // 3. Elements from your HTML
    const modal = document.getElementById('modal');
    const btn = document.getElementById('openModal');
    const display = document.getElementById('displayText');
    const input = document.getElementById('userInput');

    // 4. Function to get a random submission
    async function getRandomSubmission() {
        const { data, error } = await supabaseClient
            .from('submissions')
            .select('content')
            .eq('is_approved', true);
        
        if (data && data.length > 0) {
            const randomEntry = data[Math.floor(Math.random() * data.length)];
            display.innerText = randomEntry.content;
        } else {
            display.innerText = "No submissions yet. Be the first!";
        }
    }

    // 5. Function to handle the anonymous submission
    async function submitText() {
        const text = input.value;
        
        // Simple character check (A-Z, 0-9, and ;,.?!)
        const allowedChars = /^[a-zA-Z0-9\s;,.?!]+$/;
        if (!allowedChars.test(text)) {
            alert("Only letters, numbers, and ;,.?! are allowed.");
            return;
        }

        const { error } = await supabaseClient
            .from('submissions')
            .insert([{ content: text }]);

        // Clear input and close modal immediately for that "anonymous" feel
        input.value = "";
        modal.style.display = "none";
        alert("Submission received!"); 
    }

    // 6. Button Logic
    btn.onclick = () => modal.style.display = "block";
    
    function closeModal() {
        modal.style.display = "none";
    }

    // Close if they click outside the box
    window.onclick = (event) => {
        if (event.target == modal) modal.style.display = "none";
    }

    // 7. Load a random message immediately when page opens
    getRandomSubmission();
</script>
</html>
